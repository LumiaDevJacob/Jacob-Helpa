name: Build

# Builds the executables on every push, and attaches them to a release
# whenever a version tag is pushed (for example: git tag v2.0.0 && git push --tags).
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Build every target
        run: ./build.sh

      - name: Upload the builds
        uses: actions/upload-artifact@v4
        with:
          name: jacob-helpa
          path: dist/

      - name: Attach the builds to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
